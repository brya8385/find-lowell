<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Find Lowell — Store Locator</title>
<meta name="description" content="Find dispensaries carrying Lowell near you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --sand:#faf6ef; --surface:#fff; --sunk:#f2ece1;
    --ink:#1a1713; --ink2:#57514a; --ink3:#8a8279;
    --rule:#e3dbcd; --rule2:#cfc5b3;
    --amber:#b4622a;
    --stock:#2e6b4a; --stock-bg:#e6efe8;
    --carry:#8a6314; --carry-bg:#f6ecd9;
    --grey:#6e6a63; --grey-bg:#eceae4;
    --ind:#6b4e8f; --ind-bg:#efe9f5;
    --sat:#a85c17; --sat-bg:#f8ecdc;
    --hyb:#1f6b6b; --hyb-bg:#e2efee;
    --var:#5a6b2f; --var-bg:#eef2e2;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--sand);color:var(--ink);
       font-family:"Source Sans 3",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  h1{font-family:"Bricolage Grotesque",sans-serif;font-size:1.5rem;font-weight:800;letter-spacing:-.02em;margin:0}
  .mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
  button{font:inherit;color:inherit}

  header{background:var(--surface);border-bottom:1px solid var(--rule2);position:relative;z-index:1000}
  .hwrap{max-width:1400px;margin:0 auto;padding:16px 20px 14px}
  .brandrow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  .sub{color:var(--ink3);font-size:.85rem}
  .asof{font-family:"IBM Plex Mono",monospace;font-size:.7rem;color:var(--ink3);
        border:1px solid var(--rule2);border-radius:2px;padding:2px 7px;margin-left:auto}
  .controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .search{display:flex;align-items:center;gap:8px;border:1px solid var(--rule2);background:var(--sand);
          border-radius:3px;padding:0 10px;min-width:230px;flex:0 1 300px}
  .search input{border:0;background:transparent;padding:9px 0;font:inherit;color:inherit;width:100%;outline:none}
  .chip{border:1px solid var(--rule2);background:var(--surface);border-radius:999px;padding:5px 12px;
        font-size:.82rem;cursor:pointer;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--sand);border-color:var(--ink)}
  .chip:focus-visible,.search input:focus-visible,.card:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .grp{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .grp .lbl{font-size:.66rem;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);font-weight:600;margin-right:2px}

  main{max-width:1400px;margin:0 auto;padding:0 20px 20px;display:grid;
       grid-template-columns:minmax(340px,420px) minmax(0,1fr);gap:18px;height:calc(100vh - 118px)}
  @media (max-width:920px){main{grid-template-columns:1fr;height:auto}#map{height:60vh}}

  .panel{display:flex;flex-direction:column;min-height:0;padding-top:14px}
  .resulthead{display:flex;align-items:baseline;gap:9px;padding-bottom:9px;flex:none}
  .rcount{font-family:"Bricolage Grotesque",sans-serif;font-weight:600}
  .rnote{font-size:.8rem;color:var(--ink3)}
  .reveal{margin-bottom:9px;padding:9px 11px;border:1px dashed var(--rule2);border-radius:3px;
          font-size:.81rem;color:var(--ink2);display:flex;gap:9px;align-items:center;flex-wrap:wrap;flex:none}
  .reveal[hidden]{display:none}
  .reveal button{background:none;border:0;color:var(--amber);font-weight:600;cursor:pointer;padding:0;text-decoration:underline}
  .list{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px;flex:1;min-height:0}

  .card{border:1px solid var(--rule);background:var(--surface);padding:12px 14px;cursor:pointer;
        display:block;width:100%;text-align:left;border-radius:3px}
  .card:hover{border-color:var(--rule2)}
  .card.sel{border-color:var(--amber);box-shadow:inset 3px 0 0 var(--amber)}
  .card.tb{border-style:dashed;background:var(--sunk)}
  .ctop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .cname{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:.96rem;line-height:1.25}
  .cdist{font-family:"IBM Plex Mono",monospace;font-size:.75rem;color:var(--ink3);white-space:nowrap;flex:none}
  .caddr{font-size:.82rem;color:var(--ink2);margin:3px 0 4px}
  .ctel{margin:0 0 8px}
  .ctel a{color:var(--amber);font-family:"IBM Plex Mono",monospace;font-size:.79rem;text-decoration:none}
  .ctel a:hover{text-decoration:underline}
  .cmeta{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  .badge{font-family:"IBM Plex Mono",monospace;font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;
         padding:3px 7px;border-radius:2px}
  .b-stock{background:var(--stock-bg);color:var(--stock)}
  .b-carry{background:var(--carry-bg);color:var(--carry)}
  .b-grey{background:var(--grey-bg);color:var(--grey)}
  .price{font-family:"IBM Plex Mono",monospace;font-size:.77rem;color:var(--ink2)}
  .prods{margin-top:9px;padding-top:8px;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:3px}
  .prow{display:grid;grid-template-columns:1fr auto auto;gap:7px;align-items:baseline;row-gap:0}
  .pline{font-size:.81rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pspec{grid-column:1;font-size:.74rem;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ptags{justify-self:end}
  .tag{font-family:"IBM Plex Mono",monospace;font-size:.63rem;letter-spacing:.04em;text-transform:uppercase;
       padding:2px 5px;border-radius:2px;white-space:nowrap}
  .t-I{background:var(--ind-bg);color:var(--ind)} .t-S{background:var(--sat-bg);color:var(--sat)}
  .t-H{background:var(--hyb-bg);color:var(--hyb)} .t-V{background:var(--var-bg);color:var(--var)}
  .pprice{font-family:"IBM Plex Mono",monospace;font-size:.77rem;color:var(--ink2);justify-self:end}
  .pmore{font-size:.75rem;color:var(--ink3);padding-top:2px}
  .cta{display:inline-block;margin-top:9px;background:var(--ink);color:var(--sand);border:0;
       padding:7px 12px;font-size:.79rem;font-weight:600;border-radius:2px;text-decoration:none}
  .cta.ghost{background:transparent;color:var(--amber);border:1px solid var(--rule2)}
  .src{font-size:.74rem;color:var(--ink3);margin-top:8px;font-style:italic}
  .gate{padding:26px 18px;border:1px dashed var(--rule2);border-radius:3px;background:var(--surface)}
  .gh{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:1.12rem;margin:0 0 5px}
  .gp{margin:0 0 16px;color:var(--ink2);font-size:.88rem}
  .gstates{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
  .gbtn{display:flex;flex-direction:column;gap:1px;align-items:flex-start;cursor:pointer;
        border:1px solid var(--rule2);background:var(--sand);border-radius:3px;padding:9px 11px;text-align:left}
  .gbtn:hover{border-color:var(--amber)}
  .gbtn strong{font-family:"Bricolage Grotesque",sans-serif;font-size:1rem}
  .gbtn span{font-size:.73rem;color:var(--ink3)}
  .empty{padding:26px 14px;text-align:center;color:var(--ink3);font-size:.89rem;border:1px dashed var(--rule2);border-radius:3px}

  #map{border:1px solid var(--rule);border-radius:3px;height:100%;min-height:420px;background:var(--sunk)}
  .leaflet-container{font-family:"Source Sans 3",sans-serif;background:var(--sunk)}
  .pin{border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.35)}
  .pin-stock{background:var(--stock)} .pin-carry{background:var(--carry)}
  .pin-tb{background:transparent;border:2px dashed var(--carry)}
  .pin-tc{background:var(--grey);opacity:.8}
  .pop{font-family:"Source Sans 3",sans-serif;min-width:190px}
  .pop b{font-family:"Bricolage Grotesque",sans-serif;font-size:.95rem}
  .pop .pa{color:var(--ink2);font-size:.82rem;margin:2px 0 6px}
  .legend{background:rgba(255,255,255,.94);padding:8px 10px;border-radius:3px;font-size:.76rem;
          color:var(--ink2);line-height:1.7;box-shadow:0 1px 4px rgba(0,0,0,.14)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
  footer{max-width:1400px;margin:0 auto;padding:14px 20px 34px;font-size:.79rem;color:var(--ink3);border-top:1px solid var(--rule)}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brandrow">
      <h1>Find Lowell</h1>
      <span class="sub">Dispensaries carrying Lowell near you</span>
      <span class="asof" id="asof">—</span>
    </div>
    <div class="controls">
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="ZIP or city" autocomplete="postal-code">
      </label>
      <div class="grp" id="stChips"><span class="lbl">State</span></div>
      <div class="grp" id="radChips"><span class="lbl">Within</span></div>
      <div class="grp" id="lineChips"><span class="lbl">Line</span></div>
      <div class="grp" id="leanChips"><span class="lbl">Type</span></div>
      <button class="chip" id="stockOnly" aria-pressed="true">In stock only</button>
    </div>
  </div>
</header>

<main>
  <section class="panel">
    <div class="resulthead"><span class="rcount" id="rcount">—</span><span class="rnote" id="rnote"></span></div>
    <div class="reveal" id="reveal" hidden></div>
    <div class="list" id="list"></div>
  </section>
  <div id="map"></div>
</main>

<footer id="foot"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.v4.js"></script>
</body>
</html>
